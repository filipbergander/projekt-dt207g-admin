<!doctype html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osteria | Registrera användare</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>

<body>
    <header>
        <a href="index.html" class="logo"><span id="logo" class="material-symbols-outlined">local_pizza</span>Osteria
            Lema</a>
        <nav>
            <ul class="dashboard-list">
                <li><button id="logout-button">Logga ut</button></li>
            </ul>
        </nav>
    </header>
    <main class="register-main">
        <h1>Registrera en ny användare</h1>
        <form id="register-form" method="post">
            <h2>Registrera användare</h2>
            <div class="error-message">
                <ul></ul>
            </div>
            <div class="success-message">
                <ul></ul><span id="login-spinner" class="material-symbols-outlined hidden">local_pizza</span>
            </div>
            <div class="input-area">
                <label for="register-username">Användarnamn*</label>
                <input type="text" id="register-username" name="username" placeholder="Skriv användarnamn">
            </div>

            <div class="input-area">
                <label for="register-email">Din email*</label>
                <input type="text" id="register-email" name="email" placeholder="Skriv email">
            </div>

            <div class="input-area">
                <label for="register-password">Lösenord*</label>
                <input type="password" id="register-password" name="password" placeholder="Skriv lösenord">
            </div>
            <div class="input-area">
                <label for="register-role">Roll</label>
                <select id="register-role" name="role">
                    <option value="admin">Personal</option>
                    <option value="staff">Admin</option>
                </select>
            </div>
            <button id="register-user-btn" type="submit">Lägg till<span id="add-user-icon" class="material-symbols-outlined">
                    person_add
                </span></button>
        </form>
    </main>
    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
