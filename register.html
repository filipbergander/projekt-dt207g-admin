<!doctype html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trattoria Lema | Registrera användare</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Lema-admin">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>

<body>
    <!-- Header och navigering till startsidan -->
    <header>
        <a href="index.html" class="logo">Trattoria
            Lema</a>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html" class="home-link"><span class="material-symbols-outlined">home</span>Start</a></li>
                <li><button id="logout-button">Logga ut</button></li>
            </ul>
        </nav>
    </header>
    <!-- Brödsmulor -->
    <div class="sub-header">
        <nav aria-label="Navigering för brödsmulor">
            <ol class="breadcrumbs">
                <li><a href="index.html" class="breadcrumb-item">Start </a>></li>
                <li aria-current="page" class="breadcrumb-item">Registrera</li>
            </ol>
        </nav>
    </div>
    <!-- Registreringformulär med inputs för ny användare -->
    <main class="register-main">
        <h1>Registrera användare</h1>
        <form id="register-form" method="post">
            <h2>Ny användare</h2>
            <p>Fyll i uppgifter</p>
            <!-- Felmeddelanden visas nedanför-->
            <div class="error-message">
                <ul></ul>
            </div>
            <!-- "Lyckade meddelanden visas här med laddningsikon" -->
            <div class="success-message">
                <ul></ul><span class="loading-spinner hidden"></span>
            </div>
            <div class="input-area">
                <label for="register-username">Användarnamn*</label>
                <input type="text" id="register-username" name="username" placeholder="Skriv användarnamn">
            </div>

            <div class="input-area">
                <label for="register-email">Din email*</label>
                <input type="text" id="register-email" name="email" placeholder="Skriv email">
            </div>

            <div class="input-area">
                <label for="register-password">Lösenord*</label>
                <input type="password" id="register-password" name="password" placeholder="Skriv lösenord">
            </div>
            <div class="input-area">
                <label for="register-role">Roll</label>
                <select id="register-role" name="role">
                    <option value="personal">Personal</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button id="register-user-btn" type="submit">Lägg till<span id="add-user-icon" class="material-symbols-outlined">
                    person_add
                </span></button>
        </form>
    </main>
    <!-- Footer med länk till registreringssidan -->
    <footer id="footer">
        <p> Admin-sida för Trattoria Lema</p>
        <a href="register.html">Registrera användare</a>
    </footer>
    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
