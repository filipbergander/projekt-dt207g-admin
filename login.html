<!doctype html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trattoria Lema | Logga in</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Lema-admin">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>

<body>
    <!-- Formulär för inloggning -->
    <main class="login-main">
        <h1>Inloggning till Trattoria Lema</h1>
        <form id="login-form" method="post">
            <h2>Logga in användare</h2>
            <p>Fyll i dina uppgifter</p>
            <!-- Felmeddelanden visas nedanför-->
            <div class="error-message">
                <ul></ul>
            </div>
            <!-- "Lyckade meddelanden visas här med laddningsikon" -->
            <div class="success-message">
                <ul></ul><span id="login-spinner" class="material-symbols-outlined hidden">local_pizza</span>
            </div>
            <div class="input-area">
                <label for="login-email">Din email</label>
                <input type="text" id="login-email" name="email" placeholder="Skriv email">
            </div>
            <div class="input-area">
                <label for="login-password">Lösenord</label>
                <input type="password" id="login-password" name="password" placeholder="Skriv lösenord">
            </div>
            <button id="login-btn" type="submit">Enter<span id="login-icon"
                    class="material-symbols-outlined">login</span>
            </button>
        </form>
    </main>
    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
