<!doctype html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admingränssnitt</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

</head>

<body>
    <header>
        <a href="index.html" class="logo"><span id="logo" class="material-symbols-outlined">local_pizza</span>Osteria
            Lema</a>
        <nav>
            <ul class="dashboard-list">

                <li><button id="logout-button">Logga ut</button></li>
            </ul>
        </nav>
    </header>
    <main class="admin-main">
        <h1>Dashboard</h1>
        <div id="admin-user"></div>
        <section class="admin-container">
            <button class="cta-btn-booking">
                <span class="material-symbols-outlined">dine_heart</span>
                Se bokningar
            </button>

            <button class="cta-btn-lunch">
                <span class="material-symbols-outlined">dining</span>
                Lunchmeny
            </button>

            <button class="cta-btn-dinner">
                <span class="material-symbols-outlined">local_dining</span>
                Kvällsmeny
            </button>

            <button class="cta-btn-review">
                <span class="material-symbols-outlined">newspaper</span>
                Recensioner
            </button>
        </section>
    </main>
    <footer id="footer">
        <p> Admin-sida för Osteria Lema</p>
        <a href="register.html">Registrera användare</a>
    </footer>
    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
